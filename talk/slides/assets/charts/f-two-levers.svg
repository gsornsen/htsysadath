<rect x="56" y="538" width="1168" height="52" rx="6" fill="#2c2c2a" opacity="0.5"/>
<text x="72" y="558" fill="#c3c2b7" font-size="14.5"><tspan x="72" y="558">Task-shape caveat: the 3-min figure is a FRESH label by hand; 11–16s and 20–30s are per REVIEW task, made with agent pre-labels already on</tspan><tspan x="72" y="577">screen — different task shapes.</tspan></text>
<text x="56" y="630" fill="#c3c2b7" font-size="18"><tspan x="56" y="630">3 min → ~20 s fell through two levers, not one: an agent first pass (11–16s) and a redesigned review UI (~20–30s).</tspan><tspan x="56" y="654">Crediting agents alone would overclaim.</tspan></text>
<text x="56" y="700" fill="#898781" font-size="14">source: mining/arcs/F-agent-labeling.md — Metrics: “two levers, not one” table</text>
