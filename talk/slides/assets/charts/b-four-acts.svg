<text x="150" y="104" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Pregrade</text>
<text x="150" y="126" text-anchor="middle" fill="#898781" font-size="14">2026-07-04</text>
<text x="150" y="196" text-anchor="middle" fill="#c3c2b7" font-size="14.5"><tspan x="150" y="196">LLM-vision identify as a</tspan><tspan x="150" y="216">proof of concept —</tspan><tspan x="150" y="236">feasibility and a baseline</tspan><tspan x="150" y="256">before image-to-image</tspan></text>
