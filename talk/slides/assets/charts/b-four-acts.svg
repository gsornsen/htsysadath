<text x="803.3333333333334" y="126" text-anchor="middle" fill="#898781" font-size="14">2026-08-19 → 09-20</text>
<text x="803.3333333333334" y="196" text-anchor="middle" fill="#c3c2b7" font-size="14.5"><tspan x="803.3333333333334" y="196">one shared identify core, fast and</tspan><tspan x="803.3333333333334" y="216">accurate for BOTH bulk scan and</tspan><tspan x="803.3333333333334" y="236">scout — every app tested was slow</tspan><tspan x="803.3333333333334" y="256">and inaccurate, and identify was the</tspan><tspan x="803.3333333333334" y="276">hardest part; solve it once, build</tspan><tspan x="803.3333333333334" y="296">both apps around it</tspan></text>
<text x="803.3333333333334" y="334" text-anchor="middle" fill="#898781" font-size="12.5" font-style="italic"><tspan x="803.3333333333334" y="334">image-to-image lane 08-20 · scout switched</tspan><tspan x="803.3333333333334" y="351">to it 09-02 · LLM identify retired 09-03</tspan></text>
