<text x="476.6666666666667" y="104" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Live-stream scout</text>
<text x="476.6666666666667" y="126" text-anchor="middle" fill="#898781" font-size="14">2026-08-18</text>
<text x="476.6666666666667" y="196" text-anchor="middle" fill="#c3c2b7" font-size="14.5"><tspan x="476.6666666666667" y="196">image-to-image identify — a card is</tspan><tspan x="476.6666666666667" y="216">on screen for seconds; 6–15s breaks</tspan><tspan x="476.6666666666667" y="236">“feels live”</tspan></text>
