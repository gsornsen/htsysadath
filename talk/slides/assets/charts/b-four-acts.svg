<text x="56" y="560" fill="#c3c2b7" font-size="18"><tspan x="56" y="560">Four sequential acts, each begun for a stated reason (D9). Act 3 and act 4 framings settled by the founder (D11),</tspan><tspan x="56" y="584">superseding the earlier open questions.</tspan></text>
<text x="56" y="700" fill="#898781" font-size="14">source: mining/arcs/B-pivots.md §2 (dates from cited Grailith commits); act 3 framing and act 4 start per D11 (founder, coordinator update superseding B-pivots.md §5 Q1/Q2)</text>
