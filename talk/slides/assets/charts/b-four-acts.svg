<text x="1130" y="196" text-anchor="middle" fill="#c3c2b7" font-size="14.5"><tspan x="1130" y="196">raw comps across NM / LP /</tspan><tspan x="1130" y="216">MP / HP / DMG became its</tspan><tspan x="1130" y="236">own problem, outgrowing</tspan><tspan x="1130" y="256">“use an API”</tspan></text>
