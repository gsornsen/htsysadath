<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 440" width="1136" height="440" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<title id="t">Coordinator: the reviewer sits one tier above</title>
<desc id="d">Lanes from this repo, one column each, merging into main. Rows are model tiers, bottom to top: Haiku, Sonnet, Opus 5.5, and the coordinator (Fable). Grey boxes do the work; green boxes review it one tier up; the coordinator's review is a white outline. Haiku mined the inventory and merged. Sonnet mined experiments and pivots; Opus reviewed each (top-3, pivots) before merge. Opus wrote the synthesis plan; the coordinator reviewed it before merge. Source: docs/project/tracking.md lane table + this repo's own merge log (`git log main --oneline --merges`, 2026-09-24) — curated, not git log --all (dominated by ambient worktree-agent-* branches)</desc>
