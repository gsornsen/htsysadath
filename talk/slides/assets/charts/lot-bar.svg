<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 440" width="1136" height="440" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<title id="t">Lot-level top-3, on lots the scout did not auto-lock</title>
<desc id="d">Three stat tiles from one offline run over 87 truth lots. How often it auto-locks: 20.7% (18 of 87 lots, 95% interval 13.5–30.4%). Right when it locks: 88.9% (16 of 18 locks, 67.2–96.9%). Top-3 when it doesn't lock: 65.2% (45 of 69 lots, 53.4–75.4%), the headline, in the accent colour. Source: mining/findings/lot-top3-unlocked.md §3 (line ~75, `auto` headline row: lock rate, lock precision, non-locked top-3 last scan, with Wilson 95% intervals as stated)</desc>
<rect x="0" y="0" width="1136" height="440" fill="#1a1a19"/>
<rect x="24" y="24" width="346.6666666666667" height="392" rx="12" fill="#2c2c2a" fill-opacity="0.55" stroke="#383835" stroke-width="1.5"/>
<text x="197.33333333333334" y="88" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="600"><tspan x="197.33333333333334" y="88">how often it</tspan><tspan x="197.33333333333334" y="120">auto-locks</tspan></text>
<text x="197.33333333333334" y="244" text-anchor="middle" fill="#ffffff" font-size="80" font-weight="700">20.7%</text>
<text x="197.33333333333334" y="304" text-anchor="middle" fill="#c3c2b7" font-size="26">18 of 87 lots</text>
<text x="197.33333333333334" y="360" text-anchor="middle" fill="#898781" font-size="22">likely 13.5–30.4%</text>
<rect x="394.6666666666667" y="24" width="346.6666666666667" height="392" rx="12" fill="#2c2c2a" fill-opacity="0.55" stroke="#383835" stroke-width="1.5"/>
<text x="568" y="88" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="600"><tspan x="568" y="88">right when it locks</tspan></text>
<text x="568" y="244" text-anchor="middle" fill="#ffffff" font-size="80" font-weight="700">88.9%</text>
<text x="568" y="304" text-anchor="middle" fill="#c3c2b7" font-size="26">16 of 18 locks</text>
<text x="568" y="360" text-anchor="middle" fill="#898781" font-size="22">likely 67.2–96.9%</text>
<rect x="765.3333333333334" y="24" width="346.6666666666667" height="392" rx="12" fill="#2c2c2a" fill-opacity="0.55" stroke="#d95926" stroke-width="3"/>
<text x="938.6666666666667" y="88" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="600"><tspan x="938.6666666666667" y="88">top-3 when it doesn't</tspan></text>
<text x="938.6666666666667" y="244" text-anchor="middle" fill="#d95926" font-size="80" font-weight="700">65.2%</text>
<text x="938.6666666666667" y="304" text-anchor="middle" fill="#c3c2b7" font-size="26">45 of 69 lots</text>
<text x="938.6666666666667" y="360" text-anchor="middle" fill="#898781" font-size="22">likely 53.4–75.4%</text>
</svg>
