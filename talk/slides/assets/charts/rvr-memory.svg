<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 440" width="1136" height="440" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect x="0" y="0" width="1136" height="440" fill="#1a1a19"/>
<text x="40" y="46" fill="#898781" font-size="22" font-weight="700" letter-spacing="0.4">INSTANCE</text>
<text x="340" y="46" fill="#898781" font-size="22" font-weight="700" letter-spacing="0.4">I REMEMBERED</text>
<text x="730" y="46" fill="#898781" font-size="22" font-weight="700" letter-spacing="0.4">THE RECORD SAYS</text>
<line x1="40" y1="66" x2="1096" y2="66" stroke="#383835" stroke-width="2"/>
<text x="40" y="128" fill="#ffffff" font-size="22" font-weight="700"><tspan x="40" y="128">D4 — the simplifying</tspan><tspan x="40" y="156">win</tspan></text>
<text x="340" y="128" fill="#c3c2b7" font-size="22"><tspan x="340" y="128">Dedup and cross-language</tspan><tspan x="340" y="156">experiments were the</tspan><tspan x="340" y="184">simplifying win.</tspan></text>
<text x="730" y="128" fill="#ffffff" font-size="22"><tspan x="730" y="128">Dedup lost 14.4 pts and was</tspan><tspan x="730" y="156">killed; a tiny language head</tspan><tspan x="730" y="184">won.</tspan></text>
<line x1="40" y1="201" x2="1096" y2="201" stroke="#2c2c2a" stroke-width="1"/>
<text x="40" y="234" fill="#ffffff" font-size="22" font-weight="700"><tspan x="40" y="234">The top-3 bar's date</tspan></text>
<text x="340" y="234" fill="#c3c2b7" font-size="22"><tspan x="340" y="234">Founder set the top-3 bar on</tspan><tspan x="340" y="262">09-13 at 22:44.</tspan></text>
<text x="730" y="234" fill="#ffffff" font-size="22"><tspan x="730" y="234">The bar first appears 09-11</tspan><tspan x="730" y="262">19:37 PDT; 09-13 just</tspan><tspan x="730" y="290">restates it.</tspan></text>
<line x1="40" y1="307" x2="1096" y2="307" stroke="#2c2c2a" stroke-width="1"/>
<text x="40" y="340" fill="#ffffff" font-size="22" font-weight="700"><tspan x="40" y="340">76.9% top-3 at n = 52</tspan></text>
<text x="340" y="340" fill="#c3c2b7" font-size="22"><tspan x="340" y="340">Lot-level top-3 held around</tspan><tspan x="340" y="368">77 percent.</tspan></text>
<text x="730" y="340" fill="#ffffff" font-size="22"><tspan x="730" y="340">Small-sample high; the</tspan><tspan x="730" y="368">pooled 87-lot run gives 71.3</tspan><tspan x="730" y="396">percent overall.</tspan></text>
</svg>
