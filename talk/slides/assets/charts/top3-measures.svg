<text x="878.7880597014926" y="163" text-anchor="end" fill="#ffffff" font-size="24"><tspan font-weight="700">74.3%</tspan><tspan dx="8" font-weight="400" fill="#c3c2b7">pooled (249/335)</tspan></text>
<text x="296" y="239" text-anchor="end" fill="#ffffff" font-size="24" font-weight="600"><tspan x="296" y="239">Six-crop consensus,</tspan><tspan x="296" y="267">41 scenes</tspan></text>
