<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 440" width="1136" height="440" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<title id="t">Top-3 was measured four incompatible ways</title>
<desc id="d">Four yardsticks on one 0-100% axis, never joined. Served crops: 78.2% pooled (262/335). Same crops, offline: 74.3% pooled (249/335). Six-crop consensus over 41 scenes: 70.3% for a single crop to 82.9% with consensus. Live lots: 71.3% of all lots (62/87), 65.2% of lots not auto-locked (45/69). Source: mining/findings/top3-trajectory.md Group A (E108, line ~38), Group B (E103/E119, lines ~47-48), Group C (E109, line ~58); mining/findings/lot-top3-unlocked.md §3 (line ~67, ~75) — B1 replay and the 76.9%/42.1% points dropped per D12</desc>
