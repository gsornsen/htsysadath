<text x="257.66666666666663" y="107.00000000000003" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">35.8</text>
<text x="257.66666666666663" y="334" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700"><tspan x="257.66666666666663" y="334">before</tspan></text>
<rect x="518" y="223" width="150" height="77" rx="3" fill="#726f68"/>
<text x="593" y="209" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">15.4</text>
<text x="593" y="334" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700"><tspan x="593" y="334">faster server</tspan></text>
<rect x="853.3333333333333" y="294" width="150" height="6" rx="3" fill="#d95926"/>
