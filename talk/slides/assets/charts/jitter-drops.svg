<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 440" width="1136" height="440" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<title id="t">The flapping, fixed: answers thrown away per 100</title>
<desc id="d">Answers thrown away per 100, on a linear 0-40 axis. Before (BASE: old client, slow server): 35.8. Faster server (CTRL: old client, 3x faster server, p50 1,157 to 433 ms): 15.4. Plus keep the answer (F5: cancel the request, keep the answer): 0.14, about 1 in 700; its bar is drawn at a 6 px minimum so it stays visible. Source: grAIde-main docs/experiments/EXP-E19-drops-thrash-with-f5-2026-09-05.md §0 headline table (lines ~21-24) — measured against a control, 09-05</desc>
<rect x="0" y="0" width="1136" height="440" fill="#1a1a19"/>
<defs>
    <marker id="jitter-arrow" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="jitter-pointer" viewBox="0 0 12 12" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#d95926" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
