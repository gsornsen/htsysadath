<text x="76" y="257" text-anchor="end" fill="#898781" font-size="22">10</text>
<line x1="90" y1="200" x2="1096" y2="200" stroke="#2c2c2a" stroke-width="1"/>
<text x="76" y="207" text-anchor="end" fill="#898781" font-size="22">20</text>
<line x1="90" y1="150" x2="1096" y2="150" stroke="#2c2c2a" stroke-width="1"/>
<text x="76" y="157" text-anchor="end" fill="#898781" font-size="22">30</text>
<line x1="90" y1="100" x2="1096" y2="100" stroke="#2c2c2a" stroke-width="1"/>
<text x="76" y="107" text-anchor="end" fill="#898781" font-size="22">40</text>
<text x="90" y="66" fill="#898781" font-size="22">per 100 answers</text>
