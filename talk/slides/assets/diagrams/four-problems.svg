<text x="989.5" y="312" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central" data-fill-role="ink" fill="#ffffff">Build the hardest</text>
<text x="989.5" y="342" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central" data-fill-role="ink" fill="#ffffff">shared piece first</text>

<text x="568" y="414" font-size="24" text-anchor="middle" dominant-baseline="central" data-fill-role="muted" fill="#c3c2b7">Each one: card scout evidence, then a first step for next week.</text>
