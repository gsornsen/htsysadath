<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 440" width="1136" height="440" role="img" aria-labelledby="t d" style="font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Gates and flags that let experiments run unattended</title>
<desc id="d">Flow of seven safeguards: (1) before the run, a pass/fail bar set first (E67's failed the bar at a 14.43-point loss); (2) behind a flag, dev on and prod off; (3) capped per run on tool calls, time and spend (the labeling agents in E84: 8 calls, 60 s, $6 per run); (4) guard rails, production refuses unsafe config, with an idle-tab watchdog running in parallel; (5) judged offline on recorded data (frozen, replayed rather than live); (6) the gate passes, the change merges, and the next experiment unlocks; (7) in the morning I flip production myself (my call). Source: mining/findings/gates-and-flags.md.</desc>
