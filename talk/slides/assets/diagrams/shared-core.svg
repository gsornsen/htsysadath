<path d="M858 232 L858 168" fill="none" data-stroke-role="compute-line" stroke="#199e70" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-green)"/>
<text x="568" y="200" font-size="24" font-style="italic" text-anchor="middle" dominant-baseline="central" data-fill-role="muted" fill="#898781" >serves both</text>
