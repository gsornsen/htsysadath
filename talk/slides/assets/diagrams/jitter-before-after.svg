<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 440" width="1136" height="440" role="img" aria-labelledby="t d" style="font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The overlay: flapping, then one sticky answer</title>
<desc id="d">Before/after of the scout overlay. Before: every returned answer replaced the last, so a match was shown, overridden, and shown again (flapping). After: one sticky answer stays on screen and stale requests are cancelled. Framed as the first sign we were onto something: identify had become fast enough to flap. Numbers are on the slide 7 chart. Sources: docs/project/decisions.md D14, D16; talk/abstract-rough.md.</desc>
