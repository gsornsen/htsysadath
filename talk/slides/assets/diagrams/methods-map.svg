<title id="t">Which method fits which problem</title>
<desc id="d">Map of eight rows, in slide order: problem, then the method that fits it, then the slide that shows it. Too many forks, one of you → lanes + a reviewer one tier up → slide 10; Runs you can’t watch → gates + flags → slide 11; A tempting favourite → a pre-registered kill line → slide 12; “Is it better?” → measure the bar that matters → slide 13–14; Too much to try → let the gates tell you what to stop → slide 15; One hard core, many products → solve it once, first → slide 16; “Is the UI done?” → a persona review gate → slide 17; Repetitive judgement work → agents first, human verdict → slide 18. Source: talk/plan/critique2.md F1 (final slide numbering); talk/plan/structure-v2.md; docs/project/decisions.md D17.</desc>
