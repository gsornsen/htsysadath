<title id="t">From 6–15 s identify to 375 ms</title>
<desc id="d">Roadmap, 2026-08-18 to 2026-09-14: identify started as LLM vision at 6–15 s live (10.4 s bakeoff median, 08-18) and reached a 375 ms p50 client round trip (09-11, E88). Seven dated areas that could each have eaten weeks: identify latency, jitter, labeling throughput, accuracy and languages (E67), crop policy (E79b), measuring the right bar, knowing when the UI is done. Sources: talk/plan/structure-v2.md, mining/arcs/B-pivots.md, docs/project/decisions.md D14.</desc>
