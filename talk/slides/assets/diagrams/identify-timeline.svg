<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 440" width="1136" height="440" role="img" aria-labelledby="t d" style="font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">From 6–15 s identify to 375 ms</title>
<desc id="d">Roadmap, 2026-08-18 to 2026-09-14: identify end to end with LLM vision took 6–15 s live (10.4 s bakeoff median, 08-18); by 09-11 (E88) the identify round trip was 375 ms p50. Callouts after 09-11 are placed by order, not scale. Seven dated areas that could each have eaten weeks: identify latency, jitter, labeling throughput, accuracy and languages (E67), crop policy (E79b), measuring the right bar, knowing when the UI is done. Sources: talk/plan/structure-v2.md, mining/arcs/B-pivots.md, docs/project/decisions.md D14.</desc>
