<title id="t">From 6–15 s identify to 375 ms</title>
<desc id="d">Timeline, 2026-08-18 to 2026-09-13, spaced by order, not to scale. Start card: identify latency as the client sees it, 6–15 s live, with a 10.4 s median over 6 bakeoff captures (LLM vision, 08-18). Seven dated areas that could each have eaten weeks, in order: identify latency (08-18 to 08-20), jitter and thrash (09-02 to 09-05), labeling throughput (09-06 to 09-14), accuracy and languages (09-08, E67), crop policy (09-09, E79b), measuring the right bar (09-11), is the UI done (09-13). The axis ends at the last area. Off the axis, a result panel: identify latency as the client sees it, 375 ms p50 (client round trip, EXP-E88, 09-11). Sources: mining/arcs/B-pivots.md (6–15 s live; 5/6 at a 10.4 s median, commit 3f5eabd7e, 2026-08-18); grAIde-main docs/experiments/EXP-E88-identify-timer-retune-2026-09-11.md line 13 (client round trip p50 375 ms, p95 692 ms); talk/plan/structure-v2.md; docs/project/decisions.md D14.</desc>
