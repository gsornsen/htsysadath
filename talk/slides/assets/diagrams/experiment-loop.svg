<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 440" width="1136" height="440" role="img" aria-labelledby="t d" style="font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The experiment loop</title>
<desc id="d">Process loop: (1) log what the app does at each key moment (instrument key transitions), (2) record live sessions, (3) replay the same recorded data offline, then a loop: (4) gated experiments in isolated git worktrees overnight, (5) the gate passes against a bar set before the run, (6) merge behind a feature flag with production left off (I flip production myself), (7) the next experiment unlocks. Sources: talk/abstract-rough.md; docs/project/decisions.md D14, D16.</desc>
