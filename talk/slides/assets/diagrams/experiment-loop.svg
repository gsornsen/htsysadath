<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 440" width="1136" height="440" role="img" aria-labelledby="t d" style="font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The experiment loop</title>
<desc id="d">Process loop: (1) instrument key transitions, (2) record live sessions, (3) replay the same recorded data offline, then a loop: (4) gated experiments in isolated git worktrees overnight, (5) the gate passes against a bar set up front, (6) merge and deploy, (7) the next experiment unlocks. Human in the loop: about 30 minutes a day setting it up, Gerald's own estimate. Sources: talk/abstract-rough.md; docs/project/decisions.md D14, D16.</desc>
