<title id="t">The persona gate said DONE; the real phone said unusable</title>
<desc id="d">Four cards, left to right. (1) The brief: persona Dez, 22, phone-only, one thumb, "swipe-fast, not homework". (2) The panel verdict, P0, 2026-09-13: DONE, median seconds per task down from 30 s to 9 s. (3) The real device the next morning, 2026-09-14 09:40: I tried the deployed app on my own iPhone and called mobile "pretty much unusable" (bug B19). (4) My takeaway, testimony rather than a recorded rule: check on a real device before DONE. Sources: mining/arcs/C-personas-review.md (personas, P0 verdict table, the gate's honest failure: docs/design/2026-09-13-labeler-critique/p0-panel-verdict.md; docs/plan/2026-09-15-labeler-bug-ledger.md B19).</desc>
