<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 440" width="1136" height="440" role="img" aria-labelledby="t d" style="font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The persona gate said DONE; the real phone said unusable; then the personas got a live browser</title>
<desc id="d">Five cards, left to right. (1) The brief: persona Dez, phone only, one thumb, "swipe-fast, not homework". (2) The panel verdict, 2026-09-13: DONE, median seconds per task down from 30 s to 9 s, simulated. (3) My iPhone the next morning, 2026-09-14 09:40: the deployed app was "pretty much unusable" (bug ledger B19). (4) The fix: check on a real device before DONE. (5) Then: the personas walk a live browser (a real Chrome, not rendered screens), which in my experience meant fewer surprises before merge; that last part is my account, not measured. Sources: mining/arcs/C-personas-review.md (personas, P0 verdict, the gate's honest failure); Grailith docs/plan/2026-09-15-labeler-stability-plan.md (every labeler test at 390/1024/1440); docs/design/2026-09-21-finish-selector/05-build-plan.md (browser walk at three widths); decisions.md D23.</desc>
